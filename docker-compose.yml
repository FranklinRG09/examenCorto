services:
  proyecto_app:
    container_name: corto1_app
    image: corto:1.0
    build: .
    ports:
      - 8080:8080
    depends_on:
      - java_db

  java_db:
    container_name: java_db
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres